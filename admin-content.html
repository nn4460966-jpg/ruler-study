
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý nội dung | RULER STUDY</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f5ff;color:#172554}
header{background:linear-gradient(100deg,#10245d,#2869e8);color:white;padding:24px}
header h1{margin:0 0 8px}
header p{margin:0;color:#dce7ff}
main{max-width:1150px;margin:25px auto;padding:0 18px}
.panel{background:white;padding:22px;border-radius:17px;margin-bottom:20px;box-shadow:0 4px 16px #253f8b12}
h2{font-size:19px;margin:0 0 18px}
.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
label{display:block;font-size:13px;font-weight:bold;margin-bottom:8px}
select,input,textarea{width:100%;padding:12px;border:1px solid #dce3f5;border-radius:10px;font:inherit;background:white;color:#172554}
textarea{min-height:150px;resize:vertical;line-height:1.6}
.field{margin-bottom:16px}
button{border:0;border-radius:10px;padding:11px 16px;font-weight:bold;cursor:pointer}
.primary{background:#2869e8;color:white}
.secondary{background:#edf2ff;color:#2454bc}
.danger{background:#fff0f0;color:#d33}
.actions{display:flex;gap:9px;flex-wrap:wrap}
.status{font-size:13px;margin-top:12px;color:#2869e8;white-space:pre-wrap}
.content-item{border:1px solid #e1e7f8;border-radius:13px;padding:16px;margin-top:12px}
.content-item h3{margin:0 0 9px;font-size:17px}
.meta{font-size:12px;color:#7180a8;margin-bottom:10px}
.description{font-size:14px;line-height:1.6;white-space:pre-wrap;margin-bottom:13px}
.tag{display:inline-block;padding:5px 9px;border-radius:20px;background:#edf2ff;color:#2869e8;font-size:11px;margin-right:6px}
.empty{padding:25px;text-align:center;color:#7180a8;background:#f7f8ff;border-radius:12px}
.back{color:white;text-decoration:none;font-weight:bold}
@media(max-width:650px){.filters{grid-template-columns:1fr}header{padding:20px}main{padding:0 12px}}
</style>
</head>
<body>

<header>
  <a class="back" href="admin.html">← Trang quản trị</a>
  <h1>📚 Quản lý nội dung học tập</h1>
  <p>Quản lý bài học theo từng lớp và môn học</p>
</header>

<main>
  <section class="panel">
    <h2>🎯 Chọn khu vực quản lý</h2>
    <div class="filters">
      <div>
        <label for="classSelect">Lớp học</label>
        <select id="classSelect"></select>
      </div>
      <div>
        <label for="subjectSelect">Môn học</label>
        <select id="subjectSelect"></select>
      </div>
      <div>
        <label for="typeSelect">Loại nội dung</label>
        <select id="typeSelect">
          <option value="">Tất cả nội dung</option>
          <option value="lesson">Bài học</option>
          <option value="knowledge">Kiến thức</option>
          <option value="exercise">Bài tập</option>
          <option value="test">Đề kiểm tra</option>
          <option value="resource">Tài liệu</option>
        </select>
      </div>
    </div>
  </section>

  <section class="panel" id="editor">
    <h2 id="formTitle">➕ Thêm nội dung mới</h2>
    <div class="field">
      <label for="titleInput">Tên nội dung</label>
      <input id="titleInput" placeholder="Ví dụ: Phương trình bậc hai">
    </div>
    <div class="field">
      <label for="descriptionInput">Mô tả ngắn</label>
      <input id="descriptionInput" placeholder="Giới thiệu nội dung bài học">
    </div>
    <div class="field">
      <label for="bodyInput">Nội dung chi tiết</label>
      <textarea id="bodyInput" placeholder="Nhập kiến thức, hướng dẫn học tập hoặc nội dung bài tập tại đây..."></textarea>
    </div>
    <div class="field">
      <label>
        <input type="checkbox" id="publishInput" style="width:auto">
        Xuất bản để học sinh có thể xem
      </label>
    </div>
    <div class="actions">
      <button class="primary" id="saveButton">Lưu nội dung</button>
      <button class="secondary" id="cancelButton" style="display:none">Hủy chỉnh sửa</button>
    </div>
    <div class="status" id="formStatus"></div>
  </section>

  <section class="panel">
    <h2>📖 Danh sách nội dung</h2>
    <div id="contentList"><div class="empty">Đang tải nội dung...</div></div>
  </section>
</main>

<script>
const client = window.supabase.createClient(
  "https://svhwozfwuexgiwrdripm.supabase.co",
  "sb_publishable_8lT10deFDA7OFHe2F794Kw_bon_pg8q"
);

const subjects = [
  "Toán học","Ngữ văn","Tiếng Anh","Vật lý",
  "Hóa học","Sinh học","Lịch sử","Địa lý",
  "Tin học","Công nghệ","Giáo dục công dân",
  "Giáo dục thể chất","Âm nhạc","Mỹ thuật"
];

const typeNames = {
  lesson:"Bài học",
  knowledge:"Kiến thức",
  exercise:"Bài tập",
  test:"Đề kiểm tra",
  resource:"Tài liệu"
};

let adminUser = null;
let editingId = null;

const $ = id => document.getElementById(id);

async function checkAdmin(){
  const {data,error} = await client.auth.getUser();

  if(error || !data.user){
    document.body.innerHTML = "<h2 style='padding:30px'>Vui lòng đăng nhập Admin trước.</h2>";
    return;
  }

  const {data:role,error:roleError} = await client
    .from("user_roles")
    .select("role")
    .eq("user_id",data.user.id)
    .maybeSingle();

  if(roleError || role?.role !== "admin"){
    document.body.innerHTML = "<h2 style='padding:30px'>Bạn không có quyền truy cập trang này.</h2>";
    return;
  }

  adminUser = data.user;
  initializePage();
}

function initializePage(){
  for(let i=1;i<=12;i++){
    const option=document.createElement("option");
    option.value=i;
    option.textContent="Lớp "+i;
    $("classSelect").appendChild(option);
  }

  subjects.forEach(subject=>{
    const option=document.createElement("option");
    option.value=subject;
    option.textContent=subject;
    $("subjectSelect").appendChild(option);
  });

  $("classSelect").addEventListener("change",loadContents);
  $("subjectSelect").addEventListener("change",loadContents);
  $("typeSelect").addEventListener("change",loadContents);
  $("saveButton").addEventListener("click",saveContent);
  $("cancelButton").addEventListener("click",resetForm);

  loadContents();
}

async function loadContents(){
  $("contentList").textContent="Đang tải dữ liệu...";

  let query=client
    .from("ruler_learning_contents")
    .select("*")
    .eq("class_number",Number($("classSelect").value))
    .eq("subject_name",$("subjectSelect").value)
    .order("created_at",{ascending:false});

  if($("typeSelect").value){
    query=query.eq("content_type",$("typeSelect").value);
  }

  const {data,error}=await query;

  if(error){
    $("contentList").textContent="Lỗi tải dữ liệu: "+error.message;
    return;
  }

  renderContents(data || []);
}

function renderContents(items){
  const list=$("contentList");
  list.replaceChildren();

  if(!items.length){
    const empty=document.createElement("div");
    empty.className="empty";
    empty.textContent="Chưa có nội dung nào trong lớp và môn học này.";
    list.appendChild(empty);
    return;
  }

  items.forEach(item=>{
    const card=document.createElement("article");
    card.className="content-item";

    const heading=document.createElement("h3");
    heading.textContent=item.title;

    const meta=document.createElement("div");
    meta.className="meta";
    meta.textContent="Lớp "+item.class_number+" · "+item.subject_name;

    const type=document.createElement("span");
    type.className="tag";
    type.textContent=typeNames[item.content_type] || item.content_type;

    const status=document.createElement("span");
    status.className="tag";
    status.textContent=item.is_published?"Đã xuất bản":"Bản nháp";

    const description=document.createElement("div");
    description.className="description";
    description.textContent=item.description || "";

    const actions=document.createElement("div");
    actions.className="actions";

    const edit=document.createElement("button");
    edit.className="secondary";
    edit.textContent="✏️ Sửa";
    edit.onclick=()=>editContent(item);

    const toggle=document.createElement("button");
    toggle.className="secondary";
    toggle.textContent=item.is_published?"Ẩn bài":"Xuất bản";
    toggle.onclick=()=>togglePublish(item);

    const remove=document.createElement("button");
    remove.className="danger";
    remove.textContent="🗑️ Xóa";
    remove.onclick=()=>deleteContent(item);

    card.append(heading,meta,type,status,description,actions);
    actions.append(edit,toggle,remove);
    list.appendChild(card);
  });
}

async function saveContent(){
  const title=$("titleInput").value.trim();
  const description=$("descriptionInput").value.trim();
  const body=$("bodyInput").value.trim();

  if(!title || !body){
    $("formStatus").textContent="Vui lòng nhập tên và nội dung chi tiết.";
    return;
  }

  $("saveButton").disabled=true;
  $("formStatus").textContent="Đang lưu...";

  const payload={
    class_number:Number($("classSelect").value),
    subject_name:$("subjectSelect").value,
    content_type:$("typeSelect").value || "lesson",
    title,
    description,
    content:{body},
    is_published:$("publishInput").checked,
    updated_at:new Date().toISOString()
  };

  let result;

  if(editingId){
    result=await client
      .from("ruler_learning_contents")
      .update(payload)
      .eq("id",editingId);
  }else{
    payload.created_by=adminUser.id;
    result=await client
      .from("ruler_learning_contents")
      .insert(payload);
  }

  $("saveButton").disabled=false;

  if(result.error){
    $("formStatus").textContent="Lỗi: "+result.error.message;
    return;
  }

  $("formStatus").textContent="Đã lưu nội dung thành công!";
  resetForm();
  await loadContents();
}

function editContent(item){
  editingId=item.id;

  $("classSelect").value=String(item.class_number);
  $("subjectSelect").value=item.subject_name;
  $("typeSelect").value=item.content_type;

  $("titleInput").value=item.title || "";
  $("descriptionInput").value=item.description || "";
  $("bodyInput").value=item.content?.body || "";
  $("publishInput").checked=item.is_published;

  $("formTitle").textContent="✏️ Chỉnh sửa nội dung";
  $("saveButton").textContent="Cập nhật nội dung";
  $("cancelButton").style.display="inline-block";

  window.scrollTo({top:$("editor").offsetTop,behavior:"smooth"});
}

function resetForm(){
  editingId=null;
  $("titleInput").value="";
  $("descriptionInput").value="";
  $("bodyInput").value="";
  $("publishInput").checked=false;
  $("formTitle").textContent="➕ Thêm nội dung mới";
  $("saveButton").textContent="Lưu nội dung";
  $("cancelButton").style.display="none";
  $("formStatus").textContent="";
}

async function togglePublish(item){
  const {error}=await client
    .from("ruler_learning_contents")
    .update({
      is_published:!item.is_published,
      updated_at:new Date().toISOString()
    })
    .eq("id",item.id);

  if(error){
    alert("Không cập nhật được: "+error.message);
    return;
  }

  loadContents();
}

async function deleteContent(item){
  if(!confirm("Mày có chắc muốn xóa nội dung '"+item.title+"' không?"))return;

  const {error}=await client
    .from("ruler_learning_contents")
    .delete()
    .eq("id",item.id);

  if(error){
    alert("Không xóa được: "+error.message);
    return;
  }

  loadContents();
}

checkAdmin();
</script>
</body>
</html>
