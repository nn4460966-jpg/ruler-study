
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tài khoản | RULER STUDY</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f3f6fc;color:#172554}
header{background:white;padding:20px 7%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px;box-shadow:0 2px 12px #00000010}
.logo{font-size:23px;font-weight:bold;color:#2563eb}
nav{display:flex;gap:15px;flex-wrap:wrap}
nav a{text-decoration:none;color:#334155;font-weight:600}
nav a:hover{color:#2563eb}
main{max-width:850px;margin:40px auto;padding:0 20px}
.intro{background:linear-gradient(120deg,#2563eb,#60a5fa);color:white;padding:35px;border-radius:18px;margin-bottom:30px}
.intro h1{font-size:30px;margin-bottom:12px}
.card{background:white;padding:28px;border-radius:16px;box-shadow:0 4px 15px #0000000c;margin-bottom:22px}
.card h2{margin-bottom:20px;font-size:21px}
label{display:block;font-weight:bold;margin-bottom:8px}
input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px;margin-bottom:17px}
button{padding:12px 19px;border:0;border-radius:8px;background:#2563eb;color:white;cursor:pointer;font-weight:bold;margin:4px 4px 4px 0}
button:hover{background:#1d4ed8}
.secondary{background:#e2e8f0;color:#1e293b}
.logout{background:#dc2626}
.message{margin-top:12px;line-height:1.5;color:#2563eb;overflow-wrap:anywhere}
.hidden{display:none!important}
.avatar{width:85px;height:85px;border-radius:50%;background:#dbeafe;display:flex;align-items:center;justify-content:center;font-size:38px;margin-bottom:18px}
footer{text-align:center;padding:25px;color:#64748b}
@media(max-width:600px){header{flex-direction:column}.card{padding:20px}}
</style>
</head>
<body>

<header>
<div class="logo">RULER STUDY</div>
<nav>
<a href="index.html">Trang chủ</a>
<a href="subjects.html">Môn học</a>
<a href="tools.html">Công cụ</a>
<a href="practice.html">Ôn luyện</a>
<a href="progress.html">Tiến độ</a>
<a href="achievements.html">Thành tích</a>
<a href="account.html">Tài khoản</a>
</nav>
</header>

<main>
<section class="intro">
<h1>Tài khoản của tôi 👤</h1>
<p>Chào mừng bạn đến với RULER STUDY!</p>
</section>

<!-- ĐĂNG NHẬP -->
<section class="card" id="loginArea">
<h2>Đăng nhập</h2>
<label>Gmail</label>
<input id="loginEmail" type="email" placeholder="Nhập Gmail">

<label>Mật khẩu</label>
<input id="loginPassword" type="password" placeholder="Nhập mật khẩu">

<button onclick="loginUser()">Đăng nhập</button>
<button class="secondary" onclick="showRegister()">Tạo tài khoản mới</button>
<p class="message" id="loginMessage"></p>
</section>

<!-- ĐĂNG KÝ -->
<section class="card hidden" id="registerArea">
<h2>Đăng ký tài khoản</h2>

<label>Họ và tên</label>
<input id="registerName" type="text" placeholder="Nhập họ và tên">

<label>Gmail</label>
<input id="registerEmail" type="email" placeholder="Nhập Gmail">

<label>Mật khẩu</label>
<input id="registerPassword" type="password" placeholder="Ít nhất 8 ký tự">

<label>Xác nhận mật khẩu</label>
<input id="registerConfirm" type="password" placeholder="Nhập lại mật khẩu">

<button onclick="registerUser()">Đăng ký</button>
<button class="secondary" onclick="showLogin()">Quay lại đăng nhập</button>
<p class="message" id="registerMessage"></p>
</section>

<!-- TÀI KHOẢN -->
<div id="accountArea" class="hidden">

<section class="card">
<h2>Thông tin cá nhân</h2>
<div class="avatar">👤</div>

<label>Họ và tên</label>
<input id="fullName" type="text" placeholder="Họ và tên">

<label>Email tài khoản</label>
<input id="email" type="email" disabled>

<button onclick="saveProfile()">Lưu thông tin</button>
<p class="message" id="profileMessage"></p>
</section>

<section class="card">
<h2>Đổi mật khẩu</h2>

<label>Mật khẩu mới</label>
<input id="newPassword" type="password" placeholder="Mật khẩu mới">

<label>Xác nhận mật khẩu</label>
<input id="confirmPassword" type="password" placeholder="Nhập lại mật khẩu">

<button onclick="changePassword()">Cập nhật mật khẩu</button>
<p class="message" id="passwordMessage"></p>
</section>

<section class="card">
<h2>Đăng xuất</h2>
<button class="logout" onclick="logoutUser()">Đăng xuất</button>
</section>

</div>
</main>

<footer>© 2026 RULER STUDY</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://svhwozfwuexgiwrdripm.supabase.co";

const SUPABASE_KEY = "sb_publishable_8lT10deFDA7OFHe2F794Kw_bon_pg8q";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

function message(id,text){
  document.getElementById(id).textContent=text;
}

function showLogin(){
  document.getElementById("loginArea").classList.remove("hidden");
  document.getElementById("registerArea").classList.add("hidden");
}

function showRegister(){
  document.getElementById("loginArea").classList.add("hidden");
  document.getElementById("registerArea").classList.remove("hidden");
}

async function loginUser(){
  const email=document.getElementById("loginEmail").value.trim();
  const password=document.getElementById("loginPassword").value;

  if(!email||!password){
    message("loginMessage","Vui lòng nhập Gmail và mật khẩu!");
    return;
  }

  message("loginMessage","Đang đăng nhập...");

  const {error}=await supabaseClient.auth.signInWithPassword({
    email,password
  });

  if(error){
    message("loginMessage","Đăng nhập thất bại: "+error.message);
    return;
  }

  await loadProfile();
}

async function registerUser(){
  const name=document.getElementById("registerName").value.trim();
  const email=document.getElementById("registerEmail").value.trim();
  const password=document.getElementById("registerPassword").value;
  const confirm=document.getElementById("registerConfirm").value;

  if(!name||!email||!password||!confirm){
    message("registerMessage","Vui lòng điền đầy đủ thông tin!");
    return;
  }

  if(password.length<8){
    message("registerMessage","Mật khẩu cần ít nhất 8 ký tự!");
    return;
  }

  if(password!==confirm){
    message("registerMessage","Hai mật khẩu không khớp!");
    return;
  }

  message("registerMessage","Đang tạo tài khoản...");

  const {data,error}=await supabaseClient.auth.signUp({
    email,
    password,
    options:{
      data:{full_name:name}
    }
  });

  if(error){
    message("registerMessage","Đăng ký thất bại: "+error.message);
    return;
  }

  if(data.session){
    await loadProfile();
  }else{
    message("registerMessage",
      "Đăng ký thành công! Hãy kiểm tra Gmail để xác nhận tài khoản nếu Supabase yêu cầu."
    );
  }
}

async function loadProfile(){
  const {data,error}=await supabaseClient.auth.getUser();

  if(error||!data.user){
    document.getElementById("accountArea").classList.add("hidden");
    document.getElementById("loginArea").classList.remove("hidden");
    document.getElementById("registerArea").classList.add("hidden");
    return;
  }
    const {data: roleData, error: roleError} = await supabaseClient
    .from("user_roles")
    .select("role")
    .eq("user_id", data.user.id)
    .maybeSingle();

  if (roleError) {
    message("loginMessage", "Không kiểm tra được quyền: " + roleError.message);
    return;
  }

  if (roleData?.role === "admin") {
    location.href = "admin.html";
    return;
  }

  document.getElementById("loginArea").classList.add("hidden");
  document.getElementById("registerArea").classList.add("hidden");
  document.getElementById("accountArea").classList.remove("hidden");

  document.getElementById("email").value=data.user.email||"";

  const {data:profile,error:profileError}=await supabaseClient
    .from("profiles")
    .select("full_name")
    .eq("user_id",data.user.id)
    .maybeSingle();

  if(profileError){
    message("profileMessage","Không tải được hồ sơ: "+profileError.message);
    return;
  }

  document.getElementById("fullName").value=
    profile?.full_name||data.user.user_metadata?.full_name||"";
}

async function saveProfile(){
  const {data,error}=await supabaseClient.auth.getUser();

  if(error||!data.user){
    message("profileMessage","Bạn cần đăng nhập trước!");
    return;
  }

  const fullName=document.getElementById("fullName").value.trim();

  if(!fullName){
    message("profileMessage","Hãy nhập họ và tên!");
    return;
  }

  const {error:saveError}=await supabaseClient
    .from("profiles")
    .upsert({
      user_id:data.user.id,
      full_name:fullName
    },{onConflict:"user_id"});

  message("profileMessage",
    saveError?"Lỗi lưu hồ sơ: "+saveError.message:"Đã lưu thông tin thành công!"
  );
}

async function changePassword(){
  const password=document.getElementById("newPassword").value;
  const confirm=document.getElementById("confirmPassword").value;

  if(password.length<8){
    message("passwordMessage","Mật khẩu cần ít nhất 8 ký tự!");
    return;
  }

  if(password!==confirm){
    message("passwordMessage","Hai mật khẩu không khớp!");
    return;
  }

  const {error}=await supabaseClient.auth.updateUser({password});

  message("passwordMessage",
    error?"Lỗi: "+error.message:"Đổi mật khẩu thành công!"
  );

  if(!error){
    document.getElementById("newPassword").value="";
    document.getElementById("confirmPassword").value="";
  }
}

async function logoutUser(){
  const {error}=await supabaseClient.auth.signOut();

  if(error){
    alert("Đăng xuất thất bại: "+error.message);
    return;
  }

  location.reload();
}

loadProfile();
</script>
</body>
</html>
