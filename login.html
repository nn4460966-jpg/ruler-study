<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập | RULER STUDY</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:'Be Vietnam Pro',sans-serif;color:#172554;background:linear-gradient(135deg,#edf3ff,#e7eaff)}
.card{width:min(100%,440px);padding:38px;background:#ffffffed;border:1px solid #dce4ff;border-radius:25px;box-shadow:0 18px 50px #263c7520}
.brand{text-align:center;margin-bottom:28px}
.brand-icon{font-size:42px}
.brand h1{font-size:25px;margin:8px 0;color:#142b59}
.brand p,.sub{font-size:13px;color:#64748b}
h2{font-size:22px;margin:0 0 8px}
label{display:block;font-size:13px;font-weight:700;margin:16px 0 8px}
input{width:100%;padding:14px;border:1px solid #d7e0f7;border-radius:12px;background:#f9fbff;font:inherit;outline:none}
input:focus{border-color:#527dff}
button{width:100%;border:0;border-radius:13px;padding:14px;margin-top:22px;background:linear-gradient(100deg,#3568e8,#8175ee);color:white;font:700 14px 'Be Vietnam Pro';cursor:pointer}
.message{min-height:20px;margin-top:14px;font-size:13px;color:#2563eb;line-height:1.6}
.switch,.home{text-align:center;font-size:13px;margin-top:20px}
.card{position:relative}

.close-btn{
  position:absolute;
  top:16px;
  right:16px;
  width:42px;
  height:42px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#ef4444;
  color:white;
  font-size:27px;
  font-weight:700;
  text-decoration:none;
  box-shadow:0 5px 15px #ef444455;
  transition:.2s;
}

.close-btn:hover{
  background:#dc2626;
  transform:scale(1.08);
}
  a{color:#3568e8;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<main class="card">
  <a href="index.html" class="close-btn" title="Thoát">×</a>
  <div class="brand">
    <div class="brand-icon">📚⭐</div>
    <h1>RULER STUDY</h1>
    <p>Học tốt hơn - Thành công hơn</p>
  </div>

  <h2>Đăng nhập</h2>
  <p class="sub">Đăng nhập để tiếp tục hành trình học tập.</p>

  <form id="loginForm">
    <label for="email">Gmail</label>
    <input id="email" type="email" autocomplete="username" placeholder="Nhập Gmail" required>

    <label for="password">Mật khẩu</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" required>

    <button type="submit" id="submitBtn">Đăng nhập</button>
  </form>

  <div id="message" class="message"></div>

  <div class="switch">
    Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
  </div>

  <div class="home">
    <a href="index.html">← Quay về trang chủ</a>
  </div>
</main>

<script>
const client=window.supabase.createClient(
  "https://svhwozfwuexgiwrdripm.supabase.co",
  "sb_publishable_8lT10deFDA7OFHe2F794Kw_bon_pg8q"
);

const params=new URLSearchParams(location.search);
const savedEmail=params.get("email");

if(savedEmail){
  document.getElementById("email").value=savedEmail;
}

if(params.get("registered")==="1"){
  document.getElementById("message").textContent=
    "Đăng ký thành công! Hãy đăng nhập bằng tài khoản vừa tạo.";
}

document.getElementById("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();

  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const btn=document.getElementById("submitBtn");
  const message=document.getElementById("message");

  btn.disabled=true;
  btn.textContent="Đang đăng nhập...";
  message.textContent="";

  const {error}=await client.auth.signInWithPassword({email,password});

  if(error){
    message.textContent="Đăng nhập thất bại: "+error.message;
    btn.disabled=false;
    btn.textContent="Đăng nhập";
    return;
  }

  location.href="account.html";
});
</script>
</body>
</html>
